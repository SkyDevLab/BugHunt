<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Settings — SkyDevLab Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="brand">
        <span class="badge" id="modeBadge">Demo App (Defects Active)</span>
        <h1>Account Settings</h1>
      </div>
      <div class="mode-toggle">
        <label>
          <input type="checkbox" id="defectToggle">
          <span>Fixed Mode</span>
        </label>
      </div>
    </header>

    <main class="card">
      <h2>User Profile</h2>
      <p class="subtitle">Update your personal account details below.</p>

      <!-- Alert notifications -->
      <div id="alertBox" class="alert hidden" role="alert" aria-live="polite"></div>

      <form id="profileForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            placeholder="Jane Doe" 
            aria-describedby="fullNameError"
          />
          <span id="fullNameError" class="field-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="jane.doe@example.com" 
            aria-describedby="emailError"
          />
          <span id="emailError" class="field-error" aria-live="polite"></span>
        </div>

        <div class="form-group debug-options">
          <label class="checkbox-label">
            <input type="checkbox" id="simulateApiFailure" name="simulateApiFailure" />
            <span>Simulate API Server Failure (500 Error)</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" id="saveBtn" class="btn btn-primary">Save Changes</button>
          <button type="button" id="resetBtn" class="btn btn-secondary">Reload Profile</button>
        </div>
      </form>

      <div class="profile-preview">
        <h3>Current Profile State</h3>
        <p><strong>Saved Name:</strong> <span id="displayFullName">—</span></p>
        <p><strong>Saved Email:</strong> <span id="displayEmail">—</span></p>
        <p><strong>Last Updated:</strong> <span id="displayUpdatedAt">Never</span></p>
      </div>
    </main>

    <footer class="app-footer">
      <p><small>BugHunt AI Demo Fixture &bull; SkyDevLab &bull; Deliberate defects for automated QA evaluation</small></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
